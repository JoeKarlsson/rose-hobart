name: CI

# Every push and pull request runs the unit and browser tests against the built site.
# Deploying is a manual run (Actions tab → CI → Run workflow, or `gh workflow run ci.yml`),
# and it only deploys after the tests pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The same image the screenshot baselines are made in (npm run test:visual)
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # gh-pages can't parse "[bot]" in --user, so it commits as the git identity set here
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898099+github-actions[bot]@users.noreply.github.com"
      - name: Build and publish to the gh-pages branch
        run: npm run deploy -- --repo "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
